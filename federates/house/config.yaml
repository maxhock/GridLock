# config/house_config.yaml
# A BuildingSimulationConfig for a house with NO internal components.

# No internal components
components: {}

# Thermal model for the building envelope
thermal_model:
  type: "simple_air"
  building_volume: 500.0
  initial_temperature: 20.0
  temperature_setpoint: 21.0
  heat_transfer_coefficient: 150.0 # W/°C

# Sensor for the thermal model
thermal_sensor:
  observe_indoor_temp: true
  observe_temp_error: true

# Dataset for exogenous data (weather, house load)
dataset:
  data_source:
    type: "file"
    file_path: "data/input/building_timeseries.csv" 
    time_column: "timestamp"
  params:
    # Map feature names to column names in the CSV
    feature_columns:
      price: "electricity_price"
      pv: "pv_generation"
      load: "base_load"
      ambient_temperature: "ambient_temp"
    dt_seconds: 900
    use_time_features: true
    prediction_horizon: 4 # Example: 4-step-ahead forecasts