      name: "Load profile house"
      class: "load"
      config:
        placement: "fill"  # pandapower load indices; use "fill" for all loads
        electrical_load: "h0_profile_1999_power.csv" # "H25", "electricloadcurve.csv"
        heat_load: "" # "heatloadcurve.csv"
