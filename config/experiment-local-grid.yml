general:
  name: "TestGrid"
  start_time: 0
  end_time: 86400
  time_step: 3600
  duration: 86400
  use_meta_db: "mongo"
  use_data_db: "postgres"
federation:
  id: "local-grid"
  name: "Local Pandapower Grid"
  class: "grid"
  config:
    layout: "kerber_landnetz_freileitung_1.xlsx"
  sub_federates:
    - id: "loadhouse_0"
      name: "Load profile house"
      class: "load"
      config:
        placement: "fill"
        electrical_load: "sample_house.csv"
    - id: "house_0"
      name: "sim house"
      class: "house"
      config:
        placement: [4,6]
        model:
          class: "1R1C"
          resistance: "5 Ohm"
          capacitance: "8 F"
      sub_federates:
        - id: "battery_0"
          name: "BYD Battery"
          class: "battery"
          config:
            placement: 0
            capacity: "5kWh"
            power: "5 kW"
        - id: "pv_1"
          name: "Sunwell PV"
          class: "pv"
          config:
            capacity: "5 5 kW"
            max_production: "renewables_ninja2019_munich.csv"
        - id: "hems_0"
          name: "Smart HEMS"
          class: "hems"
          config:
            control_strategy: "mpc"
            accessible: ["battery_0", "pv_1"]