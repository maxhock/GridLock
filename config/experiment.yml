data_generation:
  latitude: 48.1351
  longitude: 11.5820
  matching_mode: "distance" # match by closest distance or population
  split_by_node: true # if true, creates separate CSV files per node in data/input/tmp/

general:
    start_time: 0
    end_time: 82800  # You can adjust this as needed
    time_step: 3600
    loglevel: warning