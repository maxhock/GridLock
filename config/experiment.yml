    build_folder: ${.name}
    # grid_file: kerber_landnetz_freileitung_1.xlsx
    grid_file: grid_berlin.xlsx
    # grid_file: grid.xlsx
  house_player:
    name: house_player
    build_folder: ${.name}
    input_files:
      - tmp/node_0.csv
      - tmp/node_1.csv
      - tmp/node_2.csv
      - tmp/node_3.csv
      - tmp/node_7.csv
      - tmp/node_11.csv
      - tmp/node_12.csv
      - tmp/node_13.csv
      - tmp/node_32.csv
      - tmp/node_33.csv
      - tmp/node_57.csv
      - tmp/node_91.csv
      - tmp/node_116.csv
      - tmp/node_119.csv
      - tmp/node_122.csv
    fill_remaining: true
  # house:
  #   name: house
  #   build_folder: ${.name}
  #   placement: [0, 2, 5, 8]
  # recorder:
  #   name: recorder
  #   build_folder: ${.name}
  #   output_file: /data/output/federation.log
  logger:
    name: logger
    build_folder: ${.name}
    output_file: /data/output/federation_processed.csv
  transformer:
    name: transformer
    build_folder: ${.name}
    voltage: 1.0
  # surrogate_collector:
