federates:
  broker:
    name: broker
    build_folder: ${.name}
    federates: ${eval:'${..grid.num_nodes}+2'}
    command: helics_broker --federates=${.federates} --name=${.name} --ipv4
  grid:
    name: grid
    build_folder: ${.name}
    grid_file: kerber_landnetz_freileitung_1.xlsx
    command: python main.py --name=${.name} --broker=${..broker.name} --grid_file=${.grid_file}
  house:
    name: house
    num_houses: ${..grid.num_nodes}
    build_folder: ${.name}
    input_file: /data/input/sample_house.csv
    command: helics_player ${.input_file} --broker=${..broker.name} --name=${.name} --local
    # Optional: Explicit placement on specific grid nodes (comment out to use all nodes)
    placement: [0, 2, 5, 8]
    # Optional: Fill remaining unassigned nodes with this federate type
    fill_remaining: true
  recorder:
    name: recorder
    build_folder: ${.name}
    target: grid
    output_file: /data/output/${.target}.log
    command: helics_recorder --name=${.name} --capture=${.target} --output=${.output_file} --broker=${..broker.name}
general:
    start_time: 0
    end_time: 82800  # You can adjust this as needed
    time_step: 3600