name: gridlock-preflight

services:
  database:
    image: timescale/timescaledb:latest-pg12
    ports:
      - "${CST_POSTGRES_PORT}:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_HOST: ${CST_POSTGRES_HOST}
      POSTGRES_PORT: ${CST_POSTGRES_PORT}
      POSTGRES_DB: ${CST_POSTGRES_DB}
      POSTGRES_USER: ${CST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CST_POSTGRES_PASSWORD}
    command: postgres -c 'max_connections=1000'
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${CST_POSTGRES_USER}",
          "-d",
          "${CST_POSTGRES_DB}"
        ]
      interval: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - cst_postgres:/var/lib/postgresql/data
      - ./databases/cstdb/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sim_net

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    ports:
      - "${CST_MONGO_PORT}:27017"
    expose:
      - "27017"
    environment:
      MONGO_INITDB_DATABASE: ${CST_MONGO_DB}
      MONGODB_INITDB_ROOT_USERNAME: ${CST_MONGO_ROOT_USERNAME}
      MONGODB_INITDB_ROOT_PASSWORD: ${CST_MONGO_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.adminCommand({ ping: 1 }).ok' | mongosh mongodb://$$MONGODB_INITDB_ROOT_USERNAME:$$MONGODB_INITDB_ROOT_PASSWORD@localhost:27017/admin --quiet"
        ]
      interval: 5s
      retries: 10
    volumes:
      - cst_mongo:/data/db
      - ./databases/cstdb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    restart: unless-stopped
    networks:
      - sim_net

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - cst-tools
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${CST_POSTGRES_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${CST_POSTGRES_ADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - sim_net
    depends_on:
      database:
        condition: service_healthy

  mongoexpress:
    image: mongo-express:latest
    profiles:
      - cst-tools
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${CST_MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${CST_MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    networks:
      - sim_net
    depends_on:
      mongodb:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.2.4-ubuntu
    profiles:
      - cst-tools
    restart: unless-stopped
    environment:
      GF_LOG_LEVEL: info
      CST_HOST: ${CST_POSTGRES_HOST}
      POSTGRES_PORT: ${CST_POSTGRES_PORT}
    ports:
      - "3000:3000"
    networks:
      - sim_net
    volumes:
      - ./databases/cstdb/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./databases/cstdb/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards

  infdb:
    image: infdb
    build:
      context: ./databases/infdb
      dockerfile: Dockerfile
    env_file:
      - ${PREFLIGHT_ENV_FILE:-./config/preflight.env}
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      MONGO_HOST: mongodb://mongodb
      MONGO_PORT: 27017
      GRIDLOCK_EXPERIMENT_PATH_IN_CONTAINER: ${GRIDLOCK_EXPERIMENT_PATH_IN_CONTAINER:-/config/experiment.yaml}
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/databases/infdb/configs:/app/configs:ro
      - ${HOST_WORKSPACE_FOLDER:-.}/generated:/app/generated
      - ${HOST_WORKSPACE_FOLDER:-.}/config:/config:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - python
      - main.py
      - --experiment
      - ${GRIDLOCK_EXPERIMENT_PATH_IN_CONTAINER:-/config/experiment.yaml}
    restart: "no"
    networks:
      - sim_net

  composegen:
    image: composegen
    build:
      context: ./composegen
      dockerfile: Dockerfile
    env_file:
      - ${PREFLIGHT_ENV_FILE:-./config/preflight.env}
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      infdb:
        condition: service_completed_successfully
    environment:
      MONGO_HOST: mongodb://mongodb
      MONGO_PORT: 27017
      CST_BROKER_HOST: ${CST_BROKER_HOST}
      CST_RUNTIME_POSTGRES_HOST: ${CST_BROKER_HOST}
      CST_RUNTIME_POSTGRES_PORT: ${CST_POSTGRES_PORT}
      CST_RUNTIME_MONGO_HOST: mongodb://${CST_BROKER_HOST}
      CST_RUNTIME_MONGO_PORT: ${CST_MONGO_PORT}
      GRIDLOCK_EXPERIMENT_PATH_IN_CONTAINER: ${GRIDLOCK_EXPERIMENT_PATH_IN_CONTAINER:-/config/experiment.yaml}
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/config:/config
      - ${HOST_WORKSPACE_FOLDER:-.}/data:/data
      - ${HOST_WORKSPACE_FOLDER:-.}/generated:/app/generated
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - ${GRIDLOCK_EXPERIMENT_PATH_IN_CONTAINER:-/config/experiment.yaml}
    restart: "no"
    networks:
      - sim_net

volumes:
  cst_mongo:
  cst_postgres:

networks:
  sim_net:
