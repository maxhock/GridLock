name: CI

on: [push, pull_request]

# AGENTS.md: "Merge through pull requests" - a push-only trigger doesn't gate
# a PR from a fork or a stale branch head. cancel-in-progress avoids piling
# up redundant Docker-heavy runs when a branch gets pushed to repeatedly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and test every component
        run: ./test.sh

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure preflight env
        run: cp config/preflight.env.example config/preflight.env

      - name: Run experiment-local-grid.yml end to end
        run: ./e2e-test.sh

  e2e-parity:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification script dependencies
        run: pip install -r tools/requirements-verify-parity.txt

      - name: Configure preflight env
        run: cp config/preflight.env.example config/preflight.env

      - name: Run the Kerber pandapower parity check
        run: ./e2e-test-pandapower-parity.sh
