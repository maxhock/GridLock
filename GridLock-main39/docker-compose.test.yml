# Docker Compose Test Configuration
# Runs unit tests for all federates with test stages
# 
# Architecture:
# - Composegen: Generates runner.json files and docker-compose.yml from experiment.yml
# - Grid: Pandapower power flow simulation federate
# - broker, house_player, recorder: Currently have no unit tests (use helics_player/helics_recorder/helics_broker CLI tools)
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit

services:
  # Composegen unit tests - validates runner.json generation functions
  composegen-test:
    build:
      context: ${PWD}/composegen
      target: test

  # Grid unit tests - validates power flow logic and HELICS integration
  grid-test:
    build:
      context: ${PWD}/grid
      target: test

services:
  heat:
    build: ./heat
    container_name: heat
    depends_on:
      - broker