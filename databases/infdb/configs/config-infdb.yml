infdb:
    config-infdb: "config-infdb.yml" # only filename - change path in ".env" file "CONFIG_INFDB_PATH"
    logging:
        path: "infdb.log"
        level: "INFO" # ERROR, WARNING, INFO, DEBUG
    hosts:
        postgres: # "None" values are resolved from .env (SERVICES_POSTGRES_*)
            user: "None"
            password: "None"
            db: "None"
            host: "None"
            exposed_port: "None"
            epsg: "None"
