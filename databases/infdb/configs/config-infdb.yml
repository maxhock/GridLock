infdb:
    config-infdb: "config-infdb.yml" # only filename - change path in ".env" file "CONFIG_INFDB_PATH"
    logging:
        path: "infdb.log"
        level: "INFO" # ERROR, WARNING, INFO, DEBUG
    hosts:
        postgres:
            user: infdb_user
            password: infdb
            db: infdb
            host: localhost
            exposed_port: 54329
            epsg: 25832
    data:
        plz: 91301
        kcid: 1 # optional: filter by specific kcid
        bcid: 1 # optional: filter by specific bcid
        output_dir: "data/output"
