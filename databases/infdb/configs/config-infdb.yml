infdb:
    config-infdb: "config-infdb.yml" # only filename - change path in env file "CONFIG_INFDB_PATH"
    logging:
        path: "infdb.log"
        level: "INFO" # ERROR, WARNING, INFO, DEBUG
    hosts:
        postgres: # "None" values are resolved from environment variables (INFDB_*)
            user: "None"
            password: "None"
            db: "None"
            host: "None"
            exposed_port: 54321
            epsg: "None"
